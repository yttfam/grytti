[package]
name = "grytti"
version = "0.1.0"
edition = "2021"
description = "PTY stream parser, formatter, and Telegram bot — the YTT family's interpreter"

[dependencies]
# MQTT — subscribe to hermytt PTY streams
rumqttc = "0.24"

# VTE parsing — decode terminal escape sequences
vte = "0.13"

# Telegram bot
teloxide = { version = "0.13", features = ["macros"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
anyhow = "1"
uuid = { version = "1", features = ["v4"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
