<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>grytti</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0d1117;
  color: #c9d1d9;
  font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
  font-size: 14px;
  height: 100vh;
  display: flex;
  flex-direction: column;
}
#header {
  padding: 8px 16px;
  background: #161b22;
  border-bottom: 1px solid #30363d;
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 13px;
}
#header .title { color: #58a6ff; font-weight: bold; }
#header .state {
  padding: 2px 8px;
  border-radius: 12px;
  font-size: 11px;
  font-weight: bold;
}
.state-idle { background: #238636; color: #fff; }
.state-thinking { background: #d29922; color: #000; }
.state-unknown { background: #484f58; color: #c9d1d9; }
.state-not_logged_in { background: #da3633; color: #fff; }
#header .process { color: #8b949e; }

#messages {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.msg {
  max-width: 85%;
  padding: 8px 12px;
  border-radius: 8px;
  white-space: pre-wrap;
  word-wrap: break-word;
  line-height: 1.4;
}
.msg-user {
  align-self: flex-end;
  background: #1f6feb;
  color: #fff;
}
.msg-response {
  align-self: flex-start;
  background: #161b22;
  border: 1px solid #30363d;
}
.msg-system {
  align-self: center;
  color: #8b949e;
  font-size: 12px;
  font-style: italic;
}
.msg-thinking {
  align-self: flex-start;
  color: #d29922;
  font-size: 12px;
}
.msg-thinking::after {
  content: '';
  animation: dots 1.5s infinite;
}
@keyframes dots {
  0%, 20% { content: ''; }
  40% { content: '.'; }
  60% { content: '..'; }
  80%, 100% { content: '...'; }
}

#input-area {
  padding: 12px 16px;
  background: #161b22;
  border-top: 1px solid #30363d;
  display: flex;
  gap: 8px;
}
#input {
  flex: 1;
  background: #0d1117;
  border: 1px solid #30363d;
  border-radius: 6px;
  color: #c9d1d9;
  font-family: inherit;
  font-size: 14px;
  padding: 8px 12px;
  outline: none;
}
#input:focus { border-color: #58a6ff; }
#send {
  background: #238636;
  border: none;
  border-radius: 6px;
  color: #fff;
  padding: 8px 16px;
  cursor: pointer;
  font-family: inherit;
  font-size: 14px;
}
#send:hover { background: #2ea043; }
</style>
</head>
<body>

<div id="header">
  <span class="title">grytti</span>
  <span id="state-badge" class="state state-unknown">connecting</span>
  <span id="process" class="process"></span>
  <span style="flex:1"></span>
  <button id="copy-btn" style="background:#30363d;border:1px solid #484f58;border-radius:4px;color:#c9d1d9;padding:2px 8px;cursor:pointer;font-size:11px;font-family:inherit">Copy</button>
  <span id="session-id" class="process"></span>
</div>

<div id="messages"></div>

<div id="input-area">
  <input id="input" type="text" placeholder="Type a message..." autocomplete="off">
  <button id="send">Send</button>
</div>

<script>
const sessionId = window.location.pathname.split('/').pop();
document.getElementById('session-id').textContent = sessionId;

const messages = document.getElementById('messages');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const stateBadge = document.getElementById('state-badge');
const processEl = document.getElementById('process');

let ws;
let lastResponse = '';
let thinkingEl = null;

function connect() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(`${proto}//${location.host}/ws/${sessionId}`);

  ws.onopen = () => {
    addSystem('Connected');
    stateBadge.textContent = 'connected';
    stateBadge.className = 'state state-idle';
  };

  ws.onmessage = (e) => {
    const data = JSON.parse(e.data);

    if (data.state) {
      stateBadge.textContent = data.state;
      stateBadge.className = `state state-${data.state}`;

      if (data.state === 'thinking') {
        if (!thinkingEl) {
          thinkingEl = addThinking();
        }
      } else if (thinkingEl) {
        thinkingEl.remove();
        thinkingEl = null;
      }
    }

    if (data.process) {
      processEl.textContent = data.process === 'claude_code' ? 'Claude Code' :
                               data.process === 'shell' ? 'Shell' : '';
    }

    if (data.response && data.response !== lastResponse) {
      addResponse(data.response);
      lastResponse = data.response;
    }
  };

  ws.onclose = () => {
    addSystem('Disconnected. Reconnecting...');
    stateBadge.textContent = 'disconnected';
    stateBadge.className = 'state state-unknown';
    setTimeout(connect, 2000);
  };
}

function send() {
  const text = input.value.trim();
  if (!text || !ws || ws.readyState !== 1) return;
  ws.send(text);
  addUser(text);
  input.value = '';
}

function addUser(text) {
  const el = document.createElement('div');
  el.className = 'msg msg-user';
  el.textContent = text;
  messages.appendChild(el);
  scrollDown();
}

function addResponse(text) {
  const el = document.createElement('div');
  el.className = 'msg msg-response';
  el.textContent = text;
  messages.appendChild(el);
  scrollDown();
}

function addSystem(text) {
  const el = document.createElement('div');
  el.className = 'msg msg-system';
  el.textContent = text;
  messages.appendChild(el);
  scrollDown();
}

function addThinking() {
  const el = document.createElement('div');
  el.className = 'msg msg-thinking';
  el.textContent = 'thinking';
  messages.appendChild(el);
  scrollDown();
  return el;
}

function scrollDown() {
  messages.scrollTop = messages.scrollHeight;
}

input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') send();
});
sendBtn.addEventListener('click', send);

document.getElementById('copy-btn').addEventListener('click', () => {
  const msgs = document.querySelectorAll('.msg');
  const text = Array.from(msgs).map(el => {
    if (el.classList.contains('msg-user')) return '> ' + el.textContent;
    if (el.classList.contains('msg-response')) return el.textContent;
    if (el.classList.contains('msg-system')) return '--- ' + el.textContent + ' ---';
    return el.textContent;
  }).join('\n\n');
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById('copy-btn');
    btn.textContent = 'Copied!';
    setTimeout(() => btn.textContent = 'Copy', 1500);
  });
});

connect();
</script>
</body>
</html>
